<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1219"/>
      <stop offset="100%" stop-color="#1a1e28"/>
    </linearGradient>
    <linearGradient id="beerBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="dbBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60c5fa"/>
      <stop offset="100%" stop-color="#0074c5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mugClip">
      <rect x="128" y="120" width="210" height="280" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- === MUG BODY (database cylinder shape) === -->

  <!-- Main mug body -->
  <rect x="128" y="165" width="210" height="230" rx="18" fill="url(#beerBody)"/>

  <!-- DB cylinder top ellipse (mug rim) — doubles as the "database top" -->
  <ellipse cx="233" cy="165" rx="105" ry="28" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>

  <!-- DB cylinder bands on the mug body (the "data rows" look) -->
  <line x1="128" y1="230" x2="338" y2="230" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>
  <line x1="128" y1="290" x2="338" y2="290" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>
  <line x1="128" y1="350" x2="338" y2="350" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <!-- DB ellipse "rings" at band positions -->
  <ellipse cx="233" cy="230" rx="105" ry="12" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="233" cy="290" rx="105" ry="12" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.25"/>
  <ellipse cx="233" cy="350" rx="105" ry="12" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.2"/>

  <!-- Bottom of mug (database bottom ellipse) -->
  <ellipse cx="233" cy="395" rx="105" ry="22" fill="#b45309"/>

  <!-- Glass shine highlight -->
  <rect x="138" y="170" width="45" height="215" rx="10" fill="url(#shine)" opacity="0.7"/>

  <!-- Bubbles -->
  <circle cx="195" cy="320" r="6" fill="#fde68a" opacity="0.35"/>
  <circle cx="220" cy="355" r="4.5" fill="#fde68a" opacity="0.3"/>
  <circle cx="260" cy="300" r="7" fill="#fde68a" opacity="0.3"/>
  <circle cx="175" cy="270" r="4" fill="#fde68a" opacity="0.25"/>
  <circle cx="290" cy="340" r="5" fill="#fde68a" opacity="0.28"/>
  <circle cx="240" cy="380" r="3.5" fill="#fde68a" opacity="0.22"/>
  <circle cx="300" cy="270" r="5.5" fill="#fde68a" opacity="0.25"/>

  <!-- === FOAM TOP === -->
  <!-- Main foam mass -->
  <ellipse cx="233" cy="155" rx="108" ry="32" fill="url(#foam)"/>
  <!-- Foam bubbles overflowing -->
  <circle cx="165" cy="132" r="26" fill="#fef3c7"/>
  <circle cx="215" cy="122" r="32" fill="url(#foam)"/>
  <circle cx="270" cy="126" r="28" fill="#fef3c7"/>
  <circle cx="310" cy="136" r="22" fill="url(#foam)"/>
  <circle cx="145" cy="140" r="18" fill="#fffbeb" opacity="0.9"/>
  <circle cx="190" cy="118" r="20" fill="#fffbeb" opacity="0.85"/>
  <circle cx="248" cy="112" r="22" fill="#fffbeb" opacity="0.8"/>
  <circle cx="295" cy="118" r="17" fill="#fffbeb" opacity="0.85"/>

  <!-- === HANDLE (right side) === -->
  <path d="M338 210 C395 210, 415 260, 415 310 C415 360, 395 400, 338 400"
        stroke="url(#handleGrad)" stroke-width="26" fill="none" stroke-linecap="round"/>
  <!-- Handle inner -->
  <path d="M338 225 C380 225, 396 260, 396 310 C396 355, 380 385, 338 385"
        stroke="#1a1e28" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.3"/>

  <!-- === DATABASE ICON ON THE MUG (etched into the glass) === -->
  <!-- Small DB cylinder symbol -->
  <ellipse cx="233" cy="255" rx="30" ry="9" fill="url(#dbBlue)" opacity="0.55"/>
  <rect x="203" y="255" width="60" height="40" fill="url(#dbBlue)" opacity="0.55"/>
  <ellipse cx="233" cy="295" rx="30" ry="9" fill="url(#dbBlue)" opacity="0.55"/>
  <!-- Top ring highlight -->
  <ellipse cx="233" cy="255" rx="30" ry="9" fill="none" stroke="#7cc8fb" stroke-width="1.5" opacity="0.6"/>
  <!-- Middle ring -->
  <ellipse cx="233" cy="275" rx="30" ry="7" fill="none" stroke="#7cc8fb" stroke-width="1" opacity="0.35"/>
  <!-- Data dots -->
  <circle cx="220" cy="266" r="2.5" fill="#7cc8fb" opacity="0.7"/>
  <circle cx="233" cy="266" r="2.5" fill="#7cc8fb" opacity="0.7"/>
  <circle cx="246" cy="266" r="2.5" fill="#7cc8fb" opacity="0.7"/>
  <circle cx="220" cy="282" r="2" fill="#7cc8fb" opacity="0.5"/>
  <circle cx="233" cy="282" r="2" fill="#7cc8fb" opacity="0.5"/>
  <circle cx="246" cy="282" r="2" fill="#7cc8fb" opacity="0.5"/>

</svg>
